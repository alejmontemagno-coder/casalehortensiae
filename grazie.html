<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grazie — Casale Hortensiae</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Jost",sans-serif;background:#F5F0E8;color:#2E2A24;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 24px}
.box{max-width:540px}
.icon{font-size:48px;margin-bottom:28px}
h1{font-family:"Cormorant Garamond",serif;font-size:clamp(36px,5vw,56px);font-weight:300;color:#2E2A24;margin-bottom:18px;line-height:1.15}
h1 em{font-style:italic;color:#A87F5A}
p{font-size:15px;line-height:1.85;color:#5C5549;margin-bottom:32px}
a{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;background:#A87F5A;color:#fff;padding:15px 34px;text-decoration:none;transition:background .3s;display:inline-block}
a:hover{background:#6B4F3A}
</style>
</head>
<body>
<div class="box">
  <div class="icon">🌿</div>
  <h1>Grazie per<br>averci <em>scritto</em></h1>
  <p>Abbiamo ricevuto la tua richiesta. Risponderemo di persona entro 24 ore — niente risposte automatiche, solo noi.</p>
  <a href="/">← Torna al Casale</a>
</div>
</body>
</html>
